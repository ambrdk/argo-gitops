apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-workflows-events
  namespace: argo
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/events
            pathType: Prefix
            backend:
              service:
                name: argo-workflows-server
                port:
                  number: 2746
