apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: build-pipeline
      steps:
        - - name: clone
            template: git-clone
        - - name: build
            template: railpack-build

    - name: git-clone
      script:
        image: alpine/git:latest
        workingDir: /workspace
        command: [sh, -ebc]
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: token
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: username
                optional: true
        source: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://${GIT_USER:-oauth2}:${GIT_TOKEN}@git.zingaya.com/".insteadOf "https://git.zingaya.com/"
          fi
          git clone {{workflow.parameters.repo_url}} .
          git checkout {{workflow.parameters.commit_sha}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: railpack-build
      script:
        image: moby/buildkit:latest
        securityContext:
          privileged: true
        workingDir: /workspace
        command: [sh]
        source: |
          set -e
          echo "===> Installing base packages..."
          apk add --no-cache curl bash git tar ca-certificates

          echo "===> Downloading Railpack binary..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ASSET="arm64-unknown-linux-musl.tar.gz"
          else
            ASSET="x86_64-unknown-linux-musl.tar.gz"
          fi

          URL=$(curl -sSL https://api.github.com/repos/railwayapp/railpack/releases/latest | grep "browser_download_url" | grep "$ASSET" | cut -d '"' -f 4)
          curl -sSL "$URL" | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/railpack

          echo "===> Configuring BuildKit for local insecure registry..."
          mkdir -p /etc/buildkit
          cat <<EOF > /etc/buildkit/buildkitd.toml
          [registry."k3d-registry.localhost:5000"]
            http = true
            insecure = true
          EOF

          echo "===> Starting BuildKit daemon..."
          buildkitd --config /etc/buildkit/buildkitd.toml --addr tcp://127.0.0.1:1234 &

          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 1234 2>/dev/null; then
              echo "BuildKit daemon is ready!"
              break
            fi
            sleep 1
          done

          echo "===> Generating Railpack build plan..."
          mkdir -p /plan
          railpack plan . -o /plan/railpack-plan.json

          echo "===> Building and pushing image with buildctl..."
          buildctl --addr tcp://127.0.0.1:1234 build \
            --local context=. \
            --local dockerfile=/plan \
            --frontend=gateway.v0 \
            --opt source=ghcr.io/railwayapp/railpack-frontend \
            --output type=image,name=k3d-registry.localhost:5000/{{workflow.parameters.app_name}}:{{workflow.parameters.commit_sha}},push=true
        volumeMounts:
          - name: workspace
            mountPath: /workspace