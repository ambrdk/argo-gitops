apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
  templates:
    - name: build-pipeline
      steps:
        - - name: clone
            template: git-clone
        - - name: build
            template: buildpacks-build

    - name: git-clone
      container:
        image: alpine/git:v2.36.3
        command: [sh, -c]
        args:
          - git clone {{workflow.parameters.repo_url}} /workspace && cd /workspace && git checkout {{workflow.parameters.commit_sha}} || true
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: buildpacks-build
      container:
        image: gcr.io/buildpacks/builder:google-22
        securityContext:
          runAsUser: 0
        workingDir: /workspace
        command: ["/cnb/lifecycle/creator"]
        args:
          - "-app=/workspace"
          - "k3d-registry.localhost:5000/{{workflow.parameters.app_name}}:{{workflow.parameters.commit_sha}}"
        env:
          - name: CNB_INSECURE_REGISTRIES
            value: "k3d-registry.localhost:5000"
          - name: CNB_PLATFORM_API
            value: "0.12"
          # Указываем Go-клиенту Google путь к корневым сертификатам Ubuntu
          - name: SSL_CERT_FILE
            value: "/etc/ssl/certs/ca-certificates.crt"
          - name: SSL_CERT_DIR
            value: "/etc/ssl/certs"
        volumeMounts:
          - name: workspace
            mountPath: /workspace