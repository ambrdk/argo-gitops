apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  serviceAccountName: argo-workflow

  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400

  podGC:
    strategy: OnWorkflowSuccess

  volumeClaimGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: build-pipeline
      steps:
        - - name: clone
            template: git-clone
        - - name: build
            template: railpack-build

    - name: git-clone
      script:
        image: alpine/git:latest
        workingDir: /workspace
        command: [sh, -ebc]
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: token
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: username
                optional: true
        source: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://${GIT_USER:-oauth2}:${GIT_TOKEN}@git.zingaya.com/".insteadOf "https://git.zingaya.com/"
          fi
          git clone {{workflow.parameters.repo_url}} .
          git checkout {{workflow.parameters.commit_sha}}
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: railpack-build
      script:
        image: moby/buildkit:v0.33.0
        workingDir: /workspace
        command: [sh]
        env:
          - name: BUILDKIT_HOST
            value: tcp://buildkitd.argo.svc.cluster.local:1234
        source: |
          set -e
          echo "===> Installing base packages..."
          apk add --no-cache curl tar ca-certificates

          echo "===> Downloading Railpack binary..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ASSET="arm64-unknown-linux-musl.tar.gz"
          else
            ASSET="x86_64-unknown-linux-musl.tar.gz"
          fi

          URL=$(curl -sSL https://api.github.com/repos/railwayapp/railpack/releases/latest | grep "browser_download_url" | grep "$ASSET" | cut -d '"' -f 4)
          curl -sSL "$URL" | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/railpack

          echo "===> Generating Railpack build plan..."
          mkdir -p /plan
          railpack plan . -o /plan/railpack-plan.json

          echo "===> Building and pushing image with buildctl..."
          buildctl build \
            --local context=. \
            --local dockerfile=/plan \
            --frontend=gateway.v0 \
            --opt source=ghcr.io/railwayapp/railpack-frontend \
            --output type=image,name=k3d-registry.localhost:5000/{{workflow.parameters.app_name}}:{{workflow.parameters.commit_sha}},push=true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
