apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  onExit: exit-handler
  serviceAccountName: argo-workflow

  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400

  podGC:
    strategy: OnWorkflowSuccess

  volumeClaimGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name
      - name: project_id
      - name: event_kind

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: build-pipeline
      steps:
        - - name: notify-running
            template: report-status
            arguments:
              parameters:
                - name: state
                  value: running
                - name: failures
                  value: "[]"
        - - name: clone
            template: git-clone
        - - name: build
            template: railpack-build
        - - name: deploy
            template: rollout-restart
            when: "{{workflow.parameters.event_kind}} == push"

    - name: exit-handler
      steps:
        - - name: report
            template: report-status
            arguments:
              parameters:
                - name: state
                  value: "{{workflow.status}}"
                - name: failures
                  value: "{{workflow.failures}}"

    - name: report-status
      inputs:
        parameters:
          - name: state
          - name: failures
      script:
        image: alpine:3.22
        command: [sh, -e]
        env:
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitlab-api
                key: token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        source: |
          set -x
          apk add --no-cache curl jq

          cat <<'FAILURES' > /tmp/failures.json
          {{inputs.parameters.failures}}
          FAILURES

          API=https://git.zingaya.com/api/v4/projects/{{workflow.parameters.project_id}}
          SHA={{workflow.parameters.commit_sha}}
          UI=http://argo.localhost/workflows/argo/{{workflow.name}}

          case "{{inputs.parameters.state}}" in
            running)
              STATE=pending
              DESC="сборка запущена"
              ;;
            Succeeded)
              STATE=success
              DESC="образ собран и выкачен"
              ;;
            *)
              STATE=failed
              DESC=$(jq -r '.[0].message // "сборка упала"' /tmp/failures.json 2>/dev/null | cut -c1-250)
              ;;
          esac

          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "state=$STATE" \
            --data-urlencode "name=argo/build" \
            --data-urlencode "description=$DESC" \
            --data-urlencode "target_url=$UI" \
            "$API/statuses/$SHA")
          if [ "$CODE" -ge 300 ]; then
            echo "status api $CODE: $(cat /tmp/resp.json)"
            echo "отчёт в GitLab не удался, конвейер продолжаем"
            exit 0
          fi

          [ "$STATE" = failed ] || exit 0

          POD=$(jq -r '.[0].podName // empty' /tmp/failures.json 2>/dev/null)
          [ -n "$POD" ] || exit 0

          SA=/var/run/secrets/kubernetes.io/serviceaccount
          LOG=$(curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
            "https://kubernetes.default.svc/api/v1/namespaces/argo/pods/$POD/log?container=main&tailLines=200" || true)
          [ -n "$LOG" ] || exit 0

          {
            printf '### argo/build упал\n\n'
            printf 'Шаг `%s`, последние 200 строк:\n\n' "$(jq -r '.[0].displayName // "?"' /tmp/failures.json)"
            printf '```\n%s\n```\n' "$LOG"
          } > /tmp/note.md

          curl -sSf -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "note@/tmp/note.md" \
            "$API/repository/commits/$SHA/comments" > /dev/null

    - name: git-clone
      script:
        image: alpine/git:latest
        workingDir: /workspace
        command: [sh, -ebc]
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: token
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: username
                optional: true
        source: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://${GIT_USER:-oauth2}:${GIT_TOKEN}@git.zingaya.com/".insteadOf "https://git.zingaya.com/"
          fi
          git clone {{workflow.parameters.repo_url}} .
          git checkout {{workflow.parameters.commit_sha}}
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: railpack-build
      script:
        image: moby/buildkit:v0.33.0
        workingDir: /workspace
        command: [sh]
        env:
          - name: BUILDKIT_HOST
            value: tcp://buildkitd.argo.svc.cluster.local:1234
        source: |
          set -e
          echo "===> Installing base packages..."
          apk add --no-cache curl tar ca-certificates

          echo "===> Downloading Railpack binary..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ASSET="arm64-unknown-linux-musl.tar.gz"
          else
            ASSET="x86_64-unknown-linux-musl.tar.gz"
          fi

          URL=$(curl -sSL https://api.github.com/repos/railwayapp/railpack/releases/latest | grep "browser_download_url" | grep "$ASSET" | cut -d '"' -f 4)
          curl -sSL "$URL" | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/railpack

          echo "===> Generating Railpack build plan..."
          mkdir -p /plan
          railpack plan . -o /plan/railpack-plan.json

          IMG=k3d-registry.localhost:5000/{{workflow.parameters.app_name}}
          NAMES="$IMG:{{workflow.parameters.commit_sha}}"
          if [ "{{workflow.parameters.event_kind}}" = push ]; then
            NAMES="$NAMES,$IMG:develop"
          fi

          echo "===> Building and pushing image with buildctl..."
          buildctl build \
            --local context=. \
            --local dockerfile=/plan \
            --frontend=gateway.v0 \
            --opt source=ghcr.io/railwayapp/railpack-frontend \
            --output "type=image,\"name=$NAMES\",push=true"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: rollout-restart
      resource:
        action: patch
        mergeStrategy: strategic
        manifest: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: voximplant-deck-web
            namespace: default
          spec:
            template:
              metadata:
                annotations:
                  workflows.argoproj.io/built-commit: "{{workflow.parameters.commit_sha}}"
