apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: build-pipeline
      steps:
        - - name: clone
            template: git-clone
        - - name: build
            template: railpack-build

    - name: git-clone
      script:
        image: alpine/git:latest
        workingDir: /workspace
        command: [sh, -ebc]
        source: |
          git clone {{workflow.parameters.repo_url}} .
          git checkout {{workflow.parameters.commit_sha}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: railpack-build
      script:
        # Используем официальный BuildKit от Docker/Moby
        image: moby/buildkit:latest
        securityContext:
          privileged: true
        workingDir: /workspace
        command: [sh]
        source: |
          set -e
          echo "===> Installing curl, bash & Railpack CLI..."
          apk add --no-cache curl bash git

          # Устанавливаем официальный бинарник Railpack
          curl -sSL https://railpack.com/install.sh | sh -s -- --bin-dir /usr/local/bin

          echo "===> Configuring BuildKit for local registry..."
          mkdir -p /etc/buildkit
          cat <<EOF > /etc/buildkit/buildkitd.toml
          [registry."k3d-registry.localhost:5000"]
            http = true
            insecure = true
          EOF

          echo "===> Starting BuildKit daemon..."
          buildkitd --config /etc/buildkit/buildkitd.toml --addr tcp://127.0.0.1:1234 &

          # Ожидаем готовности сокета BuildKit
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 1234 2>/dev/null; then
              echo "BuildKit daemon is ready!"
              break
            fi
            sleep 1
          done

          echo "===> Running Railpack build..."
          railpack build \
            --buildkit-addr tcp://127.0.0.1:1234 \
            --tag k3d-registry.localhost:5000/{{workflow.parameters.app_name}}:{{workflow.parameters.commit_sha}} \
            --publish \
            .
        volumeMounts:
          - name: workspace
            mountPath: /workspace