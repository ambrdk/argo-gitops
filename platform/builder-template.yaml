apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: universal-vercel-like-builder
spec:
  entrypoint: build-pipeline
  onExit: exit-handler
  serviceAccountName: argo-workflow

  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400

  volumeClaimGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
      - name: repo_url
      - name: commit_sha
      - name: app_name
      - name: project_id
      - name: event_kind

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: build-pipeline
      steps:
        - - name: notify-start
            template: set-status
            arguments:
              parameters:
                - name: spec
                  value: "clone:running build:pending deploy:pending"
        - - name: clone
            template: git-clone
        - - name: notify-build
            template: set-status
            arguments:
              parameters:
                - name: spec
                  value: "clone:success build:running"
        - - name: build
            template: railpack-build
        - - name: notify-deploy
            template: set-status
            arguments:
              parameters:
                - name: spec
                  value: "build:success deploy:running"
            when: "{{workflow.parameters.event_kind}} == push"
        - - name: notify-skip
            template: set-status
            arguments:
              parameters:
                - name: spec
                  value: "build:success deploy:skipped"
            when: "{{workflow.parameters.event_kind}} != push"
        - - name: deploy
            template: rollout-restart
            when: "{{workflow.parameters.event_kind}} == push"
        - - name: notify-done
            template: set-status
            arguments:
              parameters:
                - name: spec
                  value: "deploy:success"
            when: "{{workflow.parameters.event_kind}} == push"

    - name: exit-handler
      steps:
        - - name: report
            template: report-status
            arguments:
              parameters:
                - name: state
                  value: "{{workflow.status}}"
                - name: failures
                  value: "{{workflow.failures}}"

    - name: set-status
      inputs:
        parameters:
          - name: spec
      script:
        image: curlimages/curl:8.20.0
        command: [sh, -e]
        env:
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitlab-api
                key: token
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 64Mi
        source: |
          API=https://git.zingaya.com/api/v4/projects/{{workflow.parameters.project_id}}
          SHA={{workflow.parameters.commit_sha}}
          UI=http://argo.localhost/workflows/argo/{{workflow.name}}

          for PAIR in {{inputs.parameters.spec}}; do
            JOB=${PAIR%%:*}
            STATE=${PAIR##*:}
            CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "state=$STATE" \
              --data-urlencode "name=argo/$JOB" \
              --data-urlencode "target_url=$UI" \
              "$API/statuses/$SHA")
            echo "argo/$JOB -> $STATE : $CODE"
            [ "$CODE" -lt 300 ] || cat /tmp/resp
          done

    - name: report-status
      inputs:
        parameters:
          - name: state
          - name: failures
      script:
        image: alpine:3.22
        command: [sh, -e]
        env:
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitlab-api
                key: token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        source: |
          apk add --no-cache curl jq >/dev/null

          cat <<'FAILURES' > /tmp/failures.raw
          {{inputs.parameters.failures}}
          FAILURES

          jq 'if type == "string" then fromjson else . end' /tmp/failures.raw > /tmp/failures.json || echo '[]' > /tmp/failures.json
          echo "failures: $(cat /tmp/failures.json)"

          API=https://git.zingaya.com/api/v4/projects/{{workflow.parameters.project_id}}
          SHA={{workflow.parameters.commit_sha}}
          UI=http://argo.localhost/workflows/argo/{{workflow.name}}

          set_status() {
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "state=$2" \
              --data-urlencode "name=argo/$1" \
              --data-urlencode "description=$3" \
              --data-urlencode "target_url=$UI" \
              "$API/statuses/$SHA")
            [ "$CODE" -lt 300 ] || echo "argo/$1 -> $2 отклонён: $CODE $(cat /tmp/resp.json)"
          }

          FAILED=$(jq -r '.[0].displayName // empty' /tmp/failures.json || true)
          MSG=$(jq -r '.[0].message // empty' /tmp/failures.json | cut -c1-250 || true)
          POD=$(jq -r '.[0].podName // empty' /tmp/failures.json || true)

          if [ "{{inputs.parameters.state}}" != Succeeded ]; then
            case "$FAILED" in
              clone|build|deploy) ;;
              *) FAILED=build ;;
            esac
          else
            FAILED=""
          fi

          DONE=0
          for J in clone build deploy; do
            if [ "$J" = deploy ] && [ "{{workflow.parameters.event_kind}}" != push ]; then
              set_status deploy skipped "выкатка только с develop"
            elif [ "$DONE" = 1 ]; then
              set_status "$J" canceled "не выполнялся"
            elif [ "$J" = "$FAILED" ]; then
              set_status "$J" failed "${MSG:-шаг упал}"
              DONE=1
            else
              set_status "$J" success "готово"
            fi
          done

          [ -n "$FAILED" ] || exit 0
          [ -n "$POD" ] || exit 0

          SA=/var/run/secrets/kubernetes.io/serviceaccount
          LOG=$(curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
            "https://kubernetes.default.svc/api/v1/namespaces/argo/pods/$POD/log?container=main&tailLines=200" || true)
          [ -n "$LOG" ] || exit 0

          {
            printf '### argo/%s упал\n\n' "$FAILED"
            printf 'Последние 200 строк:\n\n'
            printf '```\n%s\n```\n' "$LOG"
          } > /tmp/note.md

          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "note@/tmp/note.md" \
            "$API/repository/commits/$SHA/comments")
          [ "$CODE" -lt 300 ] || echo "комментарий отклонён: $CODE $(cat /tmp/resp.json)"

    - name: git-clone
      script:
        image: alpine/git:latest
        workingDir: /workspace
        command: [sh, -ebc]
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: token
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: username
                optional: true
        source: |
          if [ -n "$GIT_TOKEN" ]; then
            git config --global url."https://${GIT_USER:-oauth2}:${GIT_TOKEN}@git.zingaya.com/".insteadOf "https://git.zingaya.com/"
          fi
          git clone {{workflow.parameters.repo_url}} .
          git checkout {{workflow.parameters.commit_sha}}
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: railpack-build
      script:
        image: moby/buildkit:v0.33.0
        workingDir: /workspace
        command: [sh]
        env:
          - name: BUILDKIT_HOST
            value: tcp://buildkitd.argo.svc.cluster.local:1234
        source: |
          set -e
          echo "===> Installing base packages..."
          apk add --no-cache curl tar ca-certificates

          echo "===> Downloading Railpack binary..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ASSET="arm64-unknown-linux-musl.tar.gz"
          else
            ASSET="x86_64-unknown-linux-musl.tar.gz"
          fi

          URL=$(curl -sSL https://api.github.com/repos/railwayapp/railpack/releases/latest | grep "browser_download_url" | grep "$ASSET" | cut -d '"' -f 4)
          curl -sSL "$URL" | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/railpack

          echo "===> Generating Railpack build plan..."
          mkdir -p /plan
          railpack plan . -o /plan/railpack-plan.json

          IMG=k3d-registry.localhost:5000/{{workflow.parameters.app_name}}
          NAMES="$IMG:{{workflow.parameters.commit_sha}}"
          if [ "{{workflow.parameters.event_kind}}" = push ]; then
            NAMES="$NAMES,$IMG:develop"
          fi

          echo "===> Building and pushing image with buildctl..."
          buildctl build \
            --local context=. \
            --local dockerfile=/plan \
            --frontend=gateway.v0 \
            --opt source=ghcr.io/railwayapp/railpack-frontend \
            --output "type=image,\"name=$NAMES\",push=true"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: rollout-restart
      resource:
        action: patch
        mergeStrategy: strategic
        manifest: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: voximplant-deck-web
            namespace: default
          spec:
            template:
              metadata:
                annotations:
                  workflows.argoproj.io/built-commit: "{{workflow.parameters.commit_sha}}"
