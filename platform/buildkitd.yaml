apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: argo
data:
  buildkitd.toml: |
    [worker.oci]
      enabled = true
    [registry."k3d-registry.localhost:5000"]
      http = true
      insecure = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: argo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.27.1
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --config
            - /etc/buildkit/buildkitd.toml
          securityContext:
            privileged: true
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
            - name: cache
              mountPath: /var/lib/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: cache
          persistentVolumeClaim:
            claimName: buildkit-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: argo
spec:
  selector:
    app: buildkitd
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
